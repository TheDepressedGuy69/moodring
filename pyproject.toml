[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moodring"
version = "0.1.0"
description = "A mood ring for the market: HMM volatility regimes in your terminal, with an honest out-of-sample check."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["finance", "quant", "volatility", "hidden-markov-model", "regime", "terminal", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
moodring = "moodring.cli:main"

[tool.setuptools]
packages = ["moodring"]

[tool.pytest.ini_options]
testpaths = ["tests"]
